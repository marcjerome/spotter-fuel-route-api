[project]
name = "spotter"
version = "0.1.0"
description = "Fuel route planner API: cheapest fuel stops along a US driving route"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=6.1,<6.2",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "numpy>=2.5.3",
    "polyline>=2.0.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.pyright]
venvPath = "."
venv = ".venv"
